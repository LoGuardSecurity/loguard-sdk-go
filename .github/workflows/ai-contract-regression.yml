name: AI contract regression
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ai-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  LOGUARD_API_KEY: ''
  LOGGUARD_API_KEY: ''
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -short -race ./...
